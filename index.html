<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>المتجر</title>
<style>
:root{
  --bg:#f2f2f7; --ink:#0b0b0f; --dim:#55555f; --blue:#0a84ff; --green:#30d158;
  --g1:rgba(255,255,255,.74); --g2:rgba(255,255,255,.40);
  --e1:rgba(255,255,255,.95); --e2:rgba(255,255,255,.08); --e3:rgba(255,255,255,.70);
  --shadow:0 10px 30px rgba(20,20,60,.10);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000; --ink:#fff; --dim:#aeaeb8;
  --g1:rgba(255,255,255,.20); --g2:rgba(255,255,255,.07);
  --e1:rgba(255,255,255,.55); --e2:rgba(255,255,255,.06); --e3:rgba(255,255,255,.30);
  --shadow:0 10px 30px rgba(0,0,0,.45);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);
  font:16px/1.45 -apple-system,"SF Pro Text","SF Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  padding:env(safe-area-inset-top) 0 0}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
.bg i:nth-child(1){width:420px;height:420px;background:#0a84ff;top:-120px;right:-100px}
.bg i:nth-child(2){width:380px;height:380px;background:#bf5af2;top:38%;left:-140px}
.bg i:nth-child(3){width:360px;height:360px;background:#30d158;bottom:-120px;right:-60px}
@media (prefers-color-scheme:light){.bg i{opacity:.38}}
.glass{
  background:linear-gradient(180deg,var(--g1),var(--g2));
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border:1px solid transparent;
  background-clip:padding-box;
  box-shadow:var(--shadow),inset 0 1px 0 var(--e1),inset 0 -1px 0 var(--e3);
}
@media (prefers-reduced-transparency:reduce){.glass{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--bg)}}
main{max-width:640px;margin:0 auto;padding:28px 18px 150px}
h1{margin:18px 6px 2px;font-size:38px;line-height:1.1;letter-spacing:-.5px}
.count{margin:0 6px 22px;color:var(--dim);font-size:15px}
.list{display:grid;gap:14px}
.card{display:flex;gap:14px;align-items:center;padding:14px;border-radius:30px}
.icon{flex:none;width:68px;height:68px;border-radius:22.4%;object-fit:cover;
  background:linear-gradient(135deg,#5ac8fa,#0a84ff);display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:28px;overflow:hidden}
.icon img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}
.name{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--dim);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--dim);font-size:12px;margin-top:2px}
.get{
  flex:none;border:0;border-radius:999px;padding:10px 22px;font:inherit;font-weight:700;font-size:15px;
  color:#fff;background:var(--blue);text-decoration:none;cursor:pointer;
  transition:transform .35s var(--spring),background .3s;
}
.get:active{transform:scale(.9)}
.get.done{background:var(--green)}
.get:focus-visible,.bar input:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.card.open{align-items:flex-start;flex-wrap:wrap}
.card .desc{flex-basis:100%;margin:0;color:var(--dim);font-size:14px;display:none;padding:0 4px 4px}
.card.open .desc{display:block}
.card{cursor:pointer;transition:transform .35s var(--spring)}
.card:active{transform:scale(.985)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(14px + env(safe-area-inset-bottom));
  display:flex;justify-content:center;pointer-events:none}
.bar label{pointer-events:auto;width:100%;max-width:560px;border-radius:999px;display:flex;align-items:center;gap:10px;padding:0 20px;height:54px}
.bar input{flex:1;border:0;background:none;color:var(--ink);font:inherit;outline:none;min-width:0}
.bar input::placeholder{color:var(--dim)}
.msg{padding:26px;border-radius:28px;text-align:center;color:var(--dim)}
.msg button{margin-top:14px}
.sk{height:96px;border-radius:30px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<main>
  <h1>المتجر</h1>
  <p class="count" id="count">&nbsp;</p>
  <div class="list" id="list"><div class="sk glass"></div><div class="sk glass"></div><div class="sk glass"></div></div>
</main>
<div class="bar"><label class="glass">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" style="color:var(--dim)" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  <input id="q" type="search" placeholder="بحث" aria-label="بحث عن تطبيق" autocomplete="off">
</label></div>
<script>
(function(){
  var list=document.getElementById('list'), count=document.getElementById('count'), q=document.getElementById('q');
  var apps=[];
  function el(t,c,txt){var e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e}
  function size(b){return !b?'رابط خارجي':b<1048576?Math.round(b/1024)+' ك.ب':(b/1048576).toFixed(1)+' م.ب'}
  function safe(u){return /^https?:\/\//i.test(u||'')?u:null}
  function message(text,retry){
    list.replaceChildren();
    var m=el('div','msg glass',text);
    if(retry){var b=el('button','get','إعادة المحاولة');b.onclick=load;m.appendChild(document.createElement('br'));m.appendChild(b)}
    list.appendChild(m);
  }
  function render(){
    var s=q.value.trim().toLowerCase();
    var shown=apps.filter(function(a){return !s||(a.name+' '+(a.subtitle||'')).toLowerCase().indexOf(s)>-1});
    count.textContent=apps.length+' تطبيق';
    if(!shown.length){message(apps.length?'لا توجد نتائج مطابقة.':'لا توجد تطبيقات منشورة بعد.');return}
    list.replaceChildren();
    shown.forEach(function(a){
      var card=el('article','card glass');
      var ic=el('div','icon');
      if(a.icon){var img=new Image();img.alt='';img.src=a.icon.indexOf('http')===0?a.icon:new URL(a.icon,location.href).href;img.onerror=function(){img.remove();ic.textContent=(a.name||'?').charAt(0)};ic.appendChild(img)}
      else ic.textContent=(a.name||'?').charAt(0);
      var info=el('div','info');
      info.append(el('div','name',a.name),el('div','sub',a.subtitle||''),el('div','meta','الإصدار '+(a.version||'')+'  •  '+size(a.size)));
      var url=safe(a.url);
      var get=el(url?'a':'button','get','تحميل');
      if(url){get.href=url;get.rel='noopener';get.addEventListener('click',function(e){e.stopPropagation();get.textContent='تم';get.classList.add('done');setTimeout(function(){get.textContent='تحميل';get.classList.remove('done')},2200)})}
      else get.disabled=true;
      card.append(ic,info,get);
      if(a.description){card.appendChild(el('p','desc',a.description));card.addEventListener('click',function(){card.classList.toggle('open')})}
      list.appendChild(card);
    });
  }
  var SB_URL='https://fzoxfsyjpwxmtziwncho.supabase.co';
  var SB_KEY='sb_publishable_Ayd3mL1xmD9KlcWgPyI7XA_yUP2uV81';
  function load(){
    fetch(SB_URL+'/rest/v1/apps?select=*&published=eq.true&order=updated_at.desc',{cache:'no-store',headers:{apikey:SB_KEY}})
      .then(function(r){if(!r.ok)throw 0;return r.json()})
      .then(function(d){
        apps=d.map(function(a){return{id:a.package,name:a.name,subtitle:a.subtitle,description:a.description,version:a.version,size:a.size,icon:a.icon_url,url:a.apk_url}});
        render()})
      .catch(function(){count.textContent='';message('تعذّر تحميل قائمة التطبيقات. تحقق من الاتصال ثم أعد المحاولة.',true)});
  }
  q.addEventListener('input',render);
  load();
})();
</script>
</body>
</html>
